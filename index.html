<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Performance Tracker & Real-Time Dashboard</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- Top Navigation -->
    <nav class="bg-blue-800 p-4 text-white flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold">የሰራተኞች የኮርፖሬት ስራ አፈጻጸም መከታተያ (Real-Time System)</h1>
        <div id="user-info" class="text-sm font-semibold">
            <!-- Active User Name displays here -->
        </div>
    </nav>

    <div class="container mx-auto mt-6 p-4">
        <!-- System Alert / Status -->
        <div id="status-msg" class="hidden mb-4 p-4 rounded-lg text-white font-semibold"></div>

        <!-- Section 1: User Login & Switcher -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-lg font-bold mb-4 text-gray-700">1. ተጠቃሚ መምረጫ / መግቢያ</h2>
            <div class="flex flex-wrap gap-4 items-center">
                <select id="user-select" class="border p-2 rounded w-64">
                    <option value="">-- ሰራተኛ ይምረጡ --</option>
                </select>
                <button onclick="loginUser()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">ግለጽ/ግባ</button>
            </div>
        </div>

        <!-- Section 2: User Management (Admin Only View to Add Users) -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-lg font-bold mb-4 text-gray-700">2. አዲስ ሰራተኛ መመዝገቢያ (User Management)</h2>
            <div class="flex flex-wrap gap-4">
                <input type="text" id="new-user-name" placeholder="የሰራተኛው ሙሉ ስም" class="border p-2 rounded w-64">
                <input type="text" id="new-user-role" placeholder="የስራ መደብ / Role" class="border p-2 rounded w-64">
                <button onclick="addNewUser()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">አዲስ ሰራተኛ መዝግብ</button>
            </div>
        </div>

        <!-- Section 3: KPI Performance Entry & Daily Target Entry -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-lg font-bold mb-4 text-gray-700">3. የKPI ስራ መመዝገቢያ (Performance Entry)</h2>
            <form id="kpi-form" onsubmit="submitKPI(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">የKPI አርስቲክ / የስራ አይነት</label>
                    <input type="text" id="kpi-title" required placeholder="ምሳሌ፡ አዲስ ሂሳብ መክፈት" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">ዒላማ (Target)</label>
                    <input type="number" id="kpi-target" required min="1" placeholder="ምሳሌ፡ 100" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">የተከናወነ (Actual Performance)</label>
                    <input type="number" id="kpi-actual" required min="0" placeholder="ምሳሌ፡ 85" class="border p-2 rounded w-full">
                </div>
                <div class="md:col-span-3">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded w-full font-bold">
                        መረጃውን መዝግብ እና ላክ (Save & Submit)
                    </button>
                </div>
            </form>
        </div>

        <!-- Section 4: Real-Time Performance Dashboard (All Users Live Feed) -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">4. በኦንላይን የተሰሩ ስራዎች ማጠቃለያ (Live KPI Dashboard)</h2>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                    ● Real-Time Connected
                </span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm leading-normal">
                            <th class="py-3 px-4 text-left">ሰራተኛ</th>
                            <th class="py-3 px-4 text-left">የስራ አይነት (KPI)</th>
                            <th class="py-3 px-4 text-center">Target</th>
                            <th class="py-3 px-4 text-center">Actual</th>
                            <th class="py-3 px-4 text-center">Achievement (%)</th>
                            <th class="py-3 px-4 text-center">ቀን/ሰዓት</th>
                        </tr>
                    </thead>
                    <tbody id="performance-table-body" class="text-gray-600 text-sm">
                        <!-- Realtime data injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase System Logic -->
    <script>
        // 1. Firebase Configuration - የእርስዎን የFirebase መረጃዎች እዚህ ይተኩ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentUser = null;

        // 2. Real-Time User List Sync
        database.ref('users').on('value', (snapshot) => {
            const userSelect = document.getElementById('user-select');
            userSelect.innerHTML = '<option value="">-- ሰራተኛ ይምረጡ --</option>';
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    const user = data[key];
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = `${user.name} (${user.role})`;
                    userSelect.appendChild(option);
                });
            }
        });

        // 3. Add New User function
        function addNewUser() {
            const name = document.getElementById('new-user-name').value.trim();
            const role = document.getElementById('new-user-role').value.trim();

            if (!name || !role) {
                showStatus("እባክዎን ስምና የስራ መደብ ያስገቡ", "bg-red-500");
                return;
            }

            const newUserRef = database.ref('users').push();
            newUserRef.set({
                name: name,
                role: role,
                created_at: new Date().toISOString()
            }).then(() => {
                showStatus("አዲስ ሰራተኛ በተሳካ ሁኔታ ተመዝግቧል!", "bg-green-500");
                document.getElementById('new-user-name').value = '';
                document.getElementById('new-user-role').value = '';
            }).catch(err => showStatus("ስህተት፡ " + err.message, "bg-red-500"));
        }

        // 4. Select / Login User Session
        function loginUser() {
            const userId = document.getElementById('user-select').value;
            if (!userId) {
                showStatus("እባክዎ መጀመሪያ ሰራተኛ ይምረጡ", "bg-red-500");
                return;
            }

            database.ref('users/' + userId).once('value').then((snapshot) => {
                currentUser = { id: userId, ...snapshot.val() };
                document.getElementById('user-info').textContent = `የገባው ሰራተኛ፡ ${currentUser.name} (${currentUser.role})`;
                showStatus(`እንኳን ደህና መጡ ${currentUser.name}`, "bg-blue-500");
            });
        }

        // 5. Save & Submit KPI Performance
        function submitKPI(event) {
            event.preventDefault();

            if (!currentUser) {
                showStatus("መረጃ ለማስገባት መጀመሪያ ሰራተኛ መምረጥ አለብዎት!", "bg-red-500");
                return;
            }

            const title = document.getElementById('kpi-title').value;
            const target = parseFloat(document.getElementById('kpi-target').value);
            const actual = parseFloat(document.getElementById('kpi-actual').value);

            const achievement = ((actual / target) * 100).toFixed(2);

            const kpiData = {
                userId: currentUser.id,
                userName: currentUser.name,
                title: title,
                target: target,
                actual: actual,
                achievement: achievement,
                timestamp: new Date().toLocaleString('am-ET')
            };

            // Push to central database
            database.ref('performances').push(kpiData)
                .then(() => {
                    showStatus("የKPI መረጃው በኦንላይን በስኬት ተመዝግቧል!", "bg-green-500");
                    document.getElementById('kpi-form').reset();
                })
                .catch(err => showStatus("መረጃ ማስገባት አልተቻለም፡ " + err.message, "bg-red-500"));
        }

        // 6. Real-Time Data Sync & Rendering Across All Devices
        database.ref('performances').on('value', (snapshot) => {
            const tableBody = document.getElementById('performance-table-body');
            tableBody.innerHTML = '';
            const data = snapshot.val();

            if (data) {
                Object.keys(data).reverse().forEach(key => {
                    const item = data[key];
                    const row = document.createElement('tr');
                    row.className = "border-b border-gray-200 hover:bg-gray-50";

                    let statusBadge = item.achievement >= 100 
                        ? `<span class="bg-green-200 text-green-800 py-1 px-3 rounded-full text-xs font-bold">${item.achievement}%</span>`
                        : `<span class="bg-yellow-200 text-yellow-800 py-1 px-3 rounded-full text-xs font-bold">${item.achievement}%</span>`;

                    row.innerHTML = `
                        <td class="py-3 px-4 text-left font-semibold">${item.userName}</td>
                        <td class="py-3 px-4 text-left">${item.title}</td>
                        <td class="py-3 px-4 text-center">${item.target}</td>
                        <td class="py-3 px-4 text-center font-bold">${item.actual}</td>
                        <td class="py-3 px-4 text-center">${statusBadge}</td>
                        <td class="py-3 px-4 text-center text-xs text-gray-500">${item.timestamp}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } else {
                tableBody.innerHTML = '<tr><td colspan="6" class="py-4 text-center text-gray-400">ምንም የተመዘገበ መረጃ የለም</td></tr>';
            }
        });

        // Helper Notification
        function showStatus(msg, bgColor) {
            const statusDiv = document.getElementById('status-msg');
            statusDiv.textContent = msg;
            statusDiv.className = `mb-4 p-4 rounded-lg text-white font-semibold ${bgColor}`;
            statusDiv.classList.remove('hidden');
            setTimeout(() => {
                statusDiv.classList.add('hidden');
            }, 4000);
        }
    </script>
</body>
</html>
