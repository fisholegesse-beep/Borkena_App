<!-- 2. PERFORMANCE ENTRY FORM (ALL KPIs IN ONE VIEW) -->
<section id="section-entry" class="hidden max-w-5xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
    <div class="border-b pb-3 mb-5 flex justify-between items-center">
        <div>
            <h3 class="text-lg font-bold text-purple-950" id="entry-form-title">Batch Performance Entry (ሁሉም KPIs በአንድ ላይ)</h3>
            <p class="text-xs text-slate-500">ለአንዱ ሰራተኛ የሁሉም KPIs ፕላን እና አቺቭመንት እኩል ይመዝግቡ።</p>
        </div>
        <span class="bg-amber-100 text-amber-900 text-[10px] font-bold px-2.5 py-1 rounded-full border border-amber-300">All KPIs Active</span>
    </div>

    <form id="daily-entry-form" onsubmit="submitBatchEntries(event)" class="space-y-5">
        
        <!-- Common Metadata -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Date</label>
                <input type="date" id="entry-date" class="w-full p-2.5 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-400" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Time Period</label>
                <select id="entry-period" class="w-full p-2.5 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-400 font-semibold">
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                    <option value="quarterly">Quarterly</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-purple-50 p-3.5 rounded-xl border border-purple-100">
            <div>
                <label class="block text-xs font-bold text-purple-950 uppercase mb-1 flex items-center">
                    <i class="fa-solid fa-user-tie text-purple-700 mr-1.5"></i> Performer (Staff Member Name)
                </label>
                <select id="entry-staff-select" class="w-full p-2.5 border border-purple-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-400 font-semibold bg-white" required></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-purple-950 uppercase mb-1 flex items-center">
                    <i class="fa-solid fa-user-shield text-purple-700 mr-1.5"></i> Assigned Supervisor
                </label>
                <select id="entry-supervisor-select" class="w-full p-2.5 border border-purple-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-400 font-semibold bg-white" required></select>
            </div>
        </div>

        <!-- ALL KPIs BATCH INPUT GRID -->
        <div>
            <label class="block text-xs font-bold text-purple-950 uppercase mb-3 flex items-center">
                <i class="fa-solid fa-list-check text-amber-500 mr-2 text-sm"></i> 
                Enter Target Plan & Actual for All KPIs
            </label>
            <div id="kpi-batch-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[450px] overflow-y-auto custom-scrollbar p-1">
                <!-- Rendered Dynamically via JS -->
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">General Remarks / Details</label>
            <textarea id="entry-remarks" rows="2" placeholder="Provide overall notes or summary..." class="w-full p-2.5 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-400"></textarea>
        </div>

        <div class="flex items-center space-x-3 pt-2">
            <button type="submit" id="btn-submit-entry" class="flex-1 bg-purple-900 hover:bg-purple-950 text-amber-400 font-bold py-3 rounded-lg text-xs shadow transition uppercase tracking-wider flex items-center justify-center">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Save All KPI Entries
            </button>
        </div>
    </form>
</section>
